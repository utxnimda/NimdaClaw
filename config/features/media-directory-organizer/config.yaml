# media-directory-organizer 独立插件配置。
version: 1

paths:
  catalog_root: data/features/collection-detail/db
  # 桌面页首次打开时重新生成这个作品目录的安全预览；计划本身不持久化。
  default_work_root: 'U:\Little Busters!'
  # 省略 allowed_resource_roots 时，复用 collection-detail 的 resource_roots。

detection:
  format_markers:
    BDRip:
    - bdrip
    - blu-ray
    - bluray
    - bd 1920x1080
    DVDRip:
    - dvdrip
    - dvd rip
  group_markers:
    VCB:
    - vcb-studio
    - vcb studio
    - vcb
    JSUM:
    - jsum
    MW:
    - mawen1250
    - mawen

classification:
  # 组码仍以 Note.h 为准；这里仅补充作品名识别别名。
  work_aliases:
    Little Busters! Refrain:
    - Little Busters! Refrain
    - Little Busters! ～Refrain～
    - リトルバスターズ！～Refrain～
    - リトルバスターズ！Refrain
    Little Busters! EX:
    - Little Busters! EX
    - リトルバスターズ！EX

naming:
  # press_path 缺失且同一作品/格式存在多个压制组时，所有候选目录都加组后缀。
  group_suffixes:
    JSUM: Jsum
    VCB: VCB
    MW: MW

safety:
  max_files: 20000
