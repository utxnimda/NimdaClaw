  metadata:
    summary: 樱田纯，一名不愿上学而长期足不出户的中学二年生，热衷于上网购物，喜欢在购买物品后的退货限期内退回物品，买了许多奇奇怪怪的诅咒物品。有一天收到一张传单，上面只写一个“上发条 还是不上发条”的选项，在好奇心驱使下选择了“上发条”，之后房间就出现了一个神秘的皮箱，里面装着一个非常美丽而且质感近似真人的人偶，使用皮箱内的发条转动背部的开关后，人偶像有生命般的活动起来，向纯说：“我的名字是真红，蔷薇少女的第五人偶。”
