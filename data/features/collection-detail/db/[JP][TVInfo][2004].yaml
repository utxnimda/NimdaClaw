  metadata:
    summary: "C.E.70年，由于“血腥情人节”惨剧而发展成为正式的武力冲突，Z.A.F.T.与地球联合之间的战斗炽烈之极、牺牲之巨，扩大至第二次雅金·杜威攻防战后双方缔结停战条约，方才平息；然而，此一停战条约无法消去自然人与调整者纷争的火种。\r\n\r\n这场战乱中，真‧飞鸟被卷入地球联合军对奥卜的侵攻，双亲和妹妹在逃离战火途中消失在自己眼前。悲恸欲绝地紧握著唯一的遗物‧妹妹的移动电话，头上呼啸飞去的是这场战争的元凶“机动战士敢达”。失意的他自奥卜离去，前往P.L.A.N.T.。\r\n\r\n然后C.E.73年，他成为Z.A.F.T.的战士...。"
