    summary: 『最遊記RELOAD』の放送終了から間を置かずに、放送時間を深夜に移し、タイトルを『最遊記RELOAD GUNLOCK』と改題して2004年4月1日から2004年9月23日まで全26話が放送された。13話からはヘイゼルとガトは登場し、最終回までは「ヘイゼル篇」。話の展開や結末は現時点ではアニメオリジナルである。原作（2-6、10、13、14話）の内容を忠実に準拠、大半は『RELOAD』と同じくアニメ独自のストーリーで展開される。
