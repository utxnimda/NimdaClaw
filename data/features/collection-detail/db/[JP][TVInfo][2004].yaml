  metadata:
    summary: "《女孩万岁》（日文：GIRLSブラボー，Girls Bravo），是まりお金田的漫画作品。曾于角川书店出版的《少年Yes月刊》连载。2004年夏季动画化。其中文版漫画由台湾东贩出版，共十卷。\r\n主人公佐佐木雪成是水野町一位对女生有恐惧症，一旦与女生接触就会起荨麻疹的小男生。他的邻居是和他从小是青梅竹马的叫作桐绘的女生，却无法和她直接接触。他一次偶然透过家里的浴缸去到异世界蓝森林之都西莲，认识了美晴（米哈露），更惊觉当与她相处时，居然没有过敏反应。因此，他很努力与美晴交往。故事讲述男女主角在穿梭两地时所发生的趣事。\r\n\r\n\r\n(以下是官方简介)\r\n　女性恐怖症の高校生、佐々木雪成。彼はある日、突然、女の子ばっかりの世界に飛ばされてしまう。その世界は、青い森の都「セーレン」。そこで、彼は不思議な美少女、「ミハル」と出会う・・・。\r\n\r\n　「ミハル」とともに、現代世界に戻ってきた雪成であったが、戻るや否や、幼馴染でクラスメイトの「桐絵」に、カウンターパンチを食らってしまう・・・。\r\n\r\n　「ミハル」を追いかけて来た「コヨミ」や「トモカ」も加わって、今日もお約束のひと騒動が巻き起こる！！\r\n　サービスシーン大満載の、ちょっと？えっちな、ドタバタコメディ「お風呂アニメ」が大登場！！"
