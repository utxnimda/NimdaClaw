  metadata:
    summary: 度过平凡每日的高中生竹本健，在一次送货回家的途中与好友二之宫良发现了一束奇怪的光线，四处寻找后在森林中发现一个发光的亮团。一个可爱的少女从中出现，不可思议的是这少女和健理想中的女孩一模一样。然而就在此时，现场突然出现了从未见过的怪物朝着少女猛扑过来。看着女孩柔弱的样子，健虽有心保护她，却无能为力。万分焦急的情况下，健的身体在满月中发生了变化，他被一种愤怒的力量左右，神秘的少女却露出了诡异的微笑……
