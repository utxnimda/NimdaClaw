  metadata:
    summary: "在南边岛屿和双亲共同生活的11岁少年多马，某日在岛上的一处遗迹遇到了一位少女。少女名叫海尔嘉，是个沉默寡言、总是重复绘著未知地方的风景，还说想去风景所在地的奇妙女孩。于是，多玛和爱慕海尔嘉的少年·吉德两人便决定要带海尔嘉到那个“她想去的地方”。\r\n另有一群充满谜团、一身黑衣，每隔几十年就会出现的“贝佛鲁的孩子们”，他们经过长久的岁月，为的只是要追寻一号人物。即使在反复的岁月中疲于奔命，又有谜样少年·杜玛从中搅局减少他们的同伴，他们仍然一心一意不停地寻找少女。\r\n还有一位追查少年少女连续失踪事件的刑警·库克，在搜查过程得知了“贝佛鲁的孩子们”之存在。进一步深入探查发现这群孩子充满神秘、无法解释的现象，以及后来现身的神秘青年，究竟失踪的孩子们身上到底隐藏着什么不为人知的秘密？\r\n平行的3个故事到最后复杂地纠结在一起，超越了五百年的时光，而这所有的一切都源于某个行星的悲剧。"
