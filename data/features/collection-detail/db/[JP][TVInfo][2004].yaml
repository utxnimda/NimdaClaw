  metadata:
    summary: 当积雪完全融化后，关东地区的飚车手之间渐渐流传起了一个传闻，在Internet上出现了一个由群马的飚车手所建立的网站，向整个关东地区征集对手并扬言要达成“关东最速计划”，甚至还十分专业地把赛道等资料罗列出来，该网站也就是那个车队的名字叫做“Project D”！
