  metadata:
    summary: “现代视觉文化研究会”，简称“现视研”，是一个以研究动漫等综合性现代视觉文化为成立宗旨，但行吃喝玩乐之实的社团。主角笹原完士在成为大学新人后，跟同为一年级新生的重度御宅族高坂真琴一起加入了现视研。但在都是“御宅族”的社团活动中，高坂的青梅竹马春日部咲对其展开攻势；即使与其交往之后发现了高坂的“御宅族”真面目，仍不放弃将他拉回正道，因而成为社团的常客。
