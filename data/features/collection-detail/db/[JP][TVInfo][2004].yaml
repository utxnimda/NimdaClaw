  metadata:
    summary: 主角高町奈叶是个平凡的小学三年级女生，与好友在如同日常作息的前往补习途中，发现了从异世界米德其路达（又译米德芝尔达）来的雪貂尤诺·斯克莱亚。他利用心灵感应告诉奈叶，他来到这个世界的理由是为了回收他所挖掘到的太古遗产（平行次元中的高度文明的遗产）“宝石种子”。奈叶为了保护可能因为宝石种子暴走被破坏的城镇，决定代替尤诺出面回收。不料，这却只是一连串事件的开端。他们遇见，与他们一样目的，因为回收宝石种子而出现的谜样金发少女魔导师到底是……
