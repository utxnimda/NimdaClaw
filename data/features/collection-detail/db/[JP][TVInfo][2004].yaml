  metadata:
    summary: "冢本天满是高中二年级学生。和许多的女孩子一样，她也在恋爱。但是，她一直没能向她非常喜欢的人——同班同学的乌丸大路表白爱意。\r\n天不佑人，天满突然知道乌丸还有1年就要转校了这件事！尽管如此，她还是得到了妹妹八云和友人们的协助。为了告白她一会儿化装成护士，一会儿试着发出箭书等等干了一系列无厘头的事情。另一个主人公是一个无可救药的喜欢上这样的天满的高中二年级学生播磨拳儿。他是个不良少年，虽然也是那么的喜欢天满，但是和天满一样，无法向喜欢的人传达自己的爱意，过着消沉的每一天。当播磨在偶然目击到天满和乌丸一起吃午饭后，伤心欲绝的他变得从此拒绝去上学，开始了流浪的旅行。\r\n几个为爱情所困的高中二年级学生，为了实现心中对爱情的美好愿望而不懈地努力。然而，这两人绞尽脑汁，使出一切他们所能想到的办法，连累了许多无辜群众，逼得身边诸友都看不过去而纷纷插手帮忙……可惜这两人一直没能够向心上人成功告白。于是以学校为背景，一群看似普通的角色与微妙恋爱之间展开了群架似的大暴走 。"
