    summary: "中学二年级的奈绪是学校里数码摄影部的部长，虽说是部长，不过也只是有两个部员参加的小社团而已。奈绪很喜欢四处摄影，不过不知为什么奈绪拍的尽是些天空和云的照片。\r\n这一天，奈绪象往常一样在校舍屋顶上拍摄，却意外的遇上了一只能自由的操纵风，在天空中飞翔的猫，吃惊之余，奈绪从屋顶上掉了下来，却被一股强风奇迹般的救起，而操纵这股强风的，竟是代用教员的大气老师。\r\n惊异的得知大气老师故乡的人都能操纵风的奈绪决心也要得到风的力量，于是和自己的好友米琪以及同班同学的润一起来到了大气老师的故乡，那儿是被群山包围的“风之里”，并且，一年一度的“风之祭典”刚要开始举行……"
