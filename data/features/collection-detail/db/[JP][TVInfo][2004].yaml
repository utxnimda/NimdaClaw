  metadata:
    summary: "たくさんの時間が、オレたちの周りを駆け抜けていった。それは、時に優しく、時に激しく。時に冷たく――でもやがて、暖かく。\r\n めぐり来る季節は彩を重ね、オレたちもそれに包まれて、少しずつ変わりはじめていた。\r\n 「あっという間だね……もう、三年生なんだよ」\r\n 隣に並んで立つ、幼なじみのあかり。\r\n 変わらないいつもの笑顔でさえ、どこか違って見える。\r\n それぞれの夢を持って、歩きはじめた仲間たち。\r\n 動きつづける時間。新しい出会いと……別れ。\r\n いつまでも……変わらずにはいられない。\r\n そんな時。\r\n オレは……『彼女』と再会した――。\r\n 浩之とあかりが高校二年生だったあの場面から季節は\r\n 巡り、再び春が訪れた高校三年生が舞台。\r\n 彼らはどんな生活を送っているのでしょうか──。\r\n 完全新作オリジナルストーリーで贈る\r\n 『ToHeart Remenber my memories』。"
    field_sources:
